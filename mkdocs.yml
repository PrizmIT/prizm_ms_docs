site_name: Documentation
site_url: https://ms.prizm-energy.com/userguide/

theme:
  name: material
  direction: ltr
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - i18n:
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: ar
          name: العربية
          build: true
          site_name: وثائق
          theme:
            direction: rtl
          nav_translations:
            Home: الرئيسية
            Business Partners: شركاء الأعمال
            Purchases: المشتريات
            Tenders: المناقصات
            Tender to Bid: من العطاء إلى العرض
            Budget: الميزانية
            QuickBooks: تكامل QuickBooks
            Resource Manager: مدير الموارد
            Opportunities: الفرص
            RFQ: طلب عروض الأسعار
            Gatepass: تصريح المرور
            Technical Analysis: التحليل الفني
            WBS: هيكل تجزئة العمل
            Project Controls: ضوابط المشروع
            Prizm Reports: تقارير بريزم
            Report Designer: مصمم التقارير
            Tasks: المهام
            About: حول

nav:
  - Home: index.md
  - Business Partners: business-partners.md
  - Purchases: purchases.md
  - Tenders: tenders.md
  - Tender to Bid: tender-to-bid.md
  - Budget: budget.md
  - QuickBooks: quickbooks.md
  - Resource Manager: resource-manager.md
  - Opportunities: opportunities.md
  - RFQ: rfq.md
  - Gatepass: gatepass.md
  - Technical Analysis: technical-analysis.md
  - WBS: wbs.md
  - Project Controls: project-controls.md
  - Prizm Reports: prizm-reports.md
  - Report Designer: report-designer.md
  - Tasks: tasks.md
  - About: about.md
